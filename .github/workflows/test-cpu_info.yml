name: Test cpu info
on:
  push:
    branches:
      - 'main'
      - 'releases/**'
  pull_request:
  workflow_dispatch:

# The cpu_info bind-mount feature only takes effect with qemu < 8.2. Starting
# with qemu 8.2 (ubuntu-24.04), qemu-user intercepts /proc/cpuinfo reads and
# returns a synthesized cpuinfo from the -cpu option, bypassing the bind mount.
# The cpu_info jobs below therefore pin to ubuntu-22.04. The qemu >= 8.2
# emulation path is covered by test_cortex_a76 on ubuntu-24.04.
jobs:
  test_zero_w:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        cpu_info: cpuinfo/raspberrypi_zero_w
        bind_mount_repository: true
        cpu: arm1176
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c ARMv6 cpuinfo.txt
        grep -c "CPU architecture: 7" cpuinfo.txt
        grep -c 6769746875620000 cpuinfo.txt
  test_3b:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        cpu_info: cpuinfo/raspberrypi_3b
        bind_mount_repository: true
        cpu: cortex-a7
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c ARMv7 cpuinfo.txt
        grep -c "CPU architecture: 7" cpuinfo.txt
        grep -c 676974687562003b cpuinfo.txt
  test_zero2_w:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        cpu_info: cpuinfo/raspberrypi_zero2_w
        bind_mount_repository: true
        cpu: cortex-a7
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c ARMv7 cpuinfo.txt
        grep -c "CPU architecture: 7" cpuinfo.txt
        grep -c 6769746875620002 cpuinfo.txt
  test_zero2_w_arm64:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        cpu_info: cpuinfo/raspberrypi_zero2_w_arm64
        bind_mount_repository: true
        cpu: cortex-a53
        base_image: raspios_lite_arm64:latest
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c "CPU architecture: 8" cpuinfo.txt
        grep -c 6769746875620002 cpuinfo.txt
  test_4b:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        cpu_info: cpuinfo/raspberrypi_4b
        bind_mount_repository: true
        cpu: cortex-a53
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c "CPU architecture: 8" cpuinfo.txt
        grep -c 676974687562004b cpuinfo.txt
  test_5:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        cpu_info: cpuinfo/raspberrypi_5
        bind_mount_repository: true
        cpu: cortex-a53
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c "CPU architecture: 8" cpuinfo.txt
        grep -c 6769746875620050 cpuinfo.txt
  test_cortex_a76:
    # Ubuntu 24.04 ships qemu >= 8.2 which synthesizes /proc/cpuinfo from the
    # -cpu option on aarch64. No cpu_info bind mount is used here.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        bind_mount_repository: true
        cpu: cortex-a76
        base_image: raspios_lite_arm64:latest
        commands: |
            cat /proc/cpuinfo > cpuinfo.txt
    - name: Test content of cpuinfo
      run: |
        cat cpuinfo.txt
        grep -c "model name	: ARMv8 Processor rev . (v8l)" cpuinfo.txt
        grep -c "CPU architecture: 8" cpuinfo.txt
        grep -c "CPU part.*0xd0b" cpuinfo.txt
